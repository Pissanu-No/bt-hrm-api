spring.application.name=bt-hrm-api-test

spring.security.user.name=test
spring.security.user.password={noop}test
spring.security.user.role=ADMIN
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/test/v2.0
azure.activedirectory.tenant-id=test

spring.datasource.url=jdbc:h2:mem:bt_hrm_api_test;MODE=MSSQLServer;INIT=CREATE SCHEMA IF NOT EXISTS hris
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=hris
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.cloud.azure.keyvault.secret.endpoint=https://example.vault.azure.net/
spring.cloud.azure.keyvault.secret.enabled=false
keyvault.public.key=test-public-key
keyvault.private.key=test-private-key

text.salt.key=test-salt
text.iv.spec=dGVzdC10ZXN0LXRlc3QxMg==

bt.centra.api.endpoint=https://centra.example.test
